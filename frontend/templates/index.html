<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login - Home</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .btn {
            background: #ffffff;
            color: #4285F4;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        .btn:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .btn:active {
            transform: translateY(0);
        }
        .google-logo {
            width: 24px;
            height: 24px;
        }
        .features {
            margin-top: 30px;
            text-align: left;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .features h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        .features ul {
            text-align: left;
            padding-left: 20px;
        }
        .features li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <!-- Using colorful letters to represent Google logo since we can't use copyrighted assets -->
            <div style="font-size: 48px; font-weight: bold; margin-bottom: 10px;">
                <span style="color: #4285F4;">G</span>
                <span style="color: #EA4335;">o</span>
                <span style="color: #FBBC05;">o</span>
                <span style="color: #4285F4;">g</span>
                <span style="color: #34A853;">l</span>
                <span style="color: #EA4335;">e</span>
            </div>
            <h1>Welcome to My WebApp</h1>
            <p>Sign in with Google to access your personalized dashboard</p>
            <a href="{{ url_for('login') }}" class="btn">
                <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" class="google-logo">
                Sign in with Google
            </a>
        </div>
        
        <div class="features">
            <h3>Features:</h3>
            <ul>
                <li>Secure Google OAuth 2.0 authentication</li>
                <li>Personalized user profile</li>
                <li>Activity tracking and logging</li>
                <li>Modern, responsive design</li>
            </ul>
        </div>
    </div>
</body>
</html>
